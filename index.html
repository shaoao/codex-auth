  --rule-2:rgba(178,186,198,.065);
  --wash:rgba(178,186,198,.05);
  --wash-2:rgba(178,186,198,.09);
  --row:rgba(178,186,198,.042);
  --accent:#61afef;
  --accent-2:#c678dd;
  --accent-ink:#0d151d;
  --accent-soft:rgba(97,175,239,.16);
  --accent-line:rgba(97,175,239,.30);
  --well-tint:rgba(97,175,239,.085);
  --glow:rgba(97,175,239,.30);
  --ok:#98c379;
  --err:#e06c75;
  --err-soft:rgba(224,108,117,.15);
  --sheet:#1b1f25;
  --sheet-2:#191d23;
  --sheet-line:rgba(178,186,198,.115);
  --veil:rgba(10,12,15,.74);
  --dot:rgba(178,186,198,.06);
  --aura1:rgba(97,175,239,.26);
  --aura2:rgba(198,120,221,.19);
  --tk-key:#e06c75;
  --tk-str:#98c379;
  --tk-num:#d19a66;
  --tk-bool:#56b6c2;
  --tk-cmd:#61afef;
  --tk-punct:#7c8593;
  --shadow:0 1px 0 rgba(255,255,255,.032) inset,0 28px 64px -34px rgba(0,0,0,.72);
}
/* ---------------- One Light ---------------- */
:root[data-theme="light"]{
  --bg:#eef0f4;
  --bg-2:#f7f8fa;
  --bg-3:#ffffff;
  --ink:#2f333d;
  --ink-2:#4b5263;
  --ink-3:#767d8b;
  --ink-4:#a5abb7;
  --rule:rgba(47,51,61,.12);
  --rule-2:rgba(47,51,61,.06);
  --wash:rgba(47,51,61,.04);
  --wash-2:rgba(47,51,61,.07);
  --row:rgba(47,51,61,.032);
  --accent:#4078f2;
  --accent-2:#a626a4;
  --accent-ink:#ffffff;
  --accent-soft:rgba(64,120,242,.12);
  --accent-line:rgba(64,120,242,.22);
  --well-tint:rgba(64,120,242,.05);
  --glow:rgba(64,120,242,.20);
  --ok:#50a14f;
  --err:#e45649;
  --err-soft:rgba(228,86,73,.1);
  --sheet:#ffffff;
  --sheet-2:#fafbfd;
  --sheet-line:rgba(47,51,61,.13);
  --veil:rgba(238,240,244,.72);
  --dot:rgba(47,51,61,.07);
  --aura1:rgba(64,120,242,.16);
  --aura2:rgba(166,38,164,.08);
  --tk-key:#e45649;
  --tk-str:#50a14f;
  --tk-num:#b76b01;
  --tk-bool:#0184bc;
  --tk-cmd:#4078f2;
  --tk-punct:#9aa0aa;
  --shadow:0 1px 0 #fff inset,0 1px 2px rgba(47,51,61,.06),0 24px 55px -32px rgba(47,51,61,.34);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  min-height:100dvh;overflow-x:hidden;
  transition:background-color .5s var(--ease),color .5s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
svg{display:block}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ---------------- ambient ---------------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;opacity:.9}
.aura.a{width:54vw;height:54vw;left:-14vw;top:-20vw;background:radial-gradient(circle,var(--aura1),transparent 63%);animation:driftA 28s var(--ease-io) infinite alternate}
.aura.b{width:48vw;height:48vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,var(--aura2),transparent 65%);animation:driftB 34s var(--ease-io) infinite alternate}
@keyframes driftA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,5vh,0) scale(1.16)}}
@keyframes driftB{from{transform:translate3d(0,0,0) scale(1.04)}to{transform:translate3d(-6vw,-4vh,0) scale(.9)}}
.mesh{
  position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(130% 95% at 50% 0%,#000 18%,transparent 76%);
  mask-image:radial-gradient(130% 95% at 50% 0%,#000 18%,transparent 76%);
}

.xlink{
  position:absolute;left:clamp(14px,2.2vw,28px);bottom:clamp(12px,1.8vh,20px);
  display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  color:var(--ink-3);opacity:.92;z-index:5;
  transition:color .25s var(--ease),background-color .25s var(--ease),transform .25s var(--ease);
}
.xlink:hover{color:var(--ink);opacity:1;background:var(--wash);transform:translateY(-2px)}
.xlink svg{width:13.5px;height:13.5px}
.frame{
  position:relative;z-index:1;
  max-width:1240px;margin:0 auto;
  padding:0 clamp(20px,4vw,48px);
  min-height:100dvh;
  display:grid;grid-template-rows:56px minmax(0,1fr);
  transition:transform .55s var(--ease),opacity .45s var(--ease);
}

/* ---------------- top bar ---------------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:24px;height:24px;border-radius:7px;flex:0 0 auto;
  display:grid;place-items:center;
  background:var(--wash);border:1px solid var(--rule);
  color:var(--accent);
}
.mark svg{width:14px;height:14px}
.word{
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
}
.bar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
@keyframes ping{0%{transform:scale(.5);opacity:.6}70%,100%{transform:scale(2);opacity:0}}

.gbtn{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border:0;border-radius:999px;
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;
  background:transparent;
  transition:color .25s var(--ease),background-color .25s var(--ease),transform .2s var(--ease);
}
.gbtn:hover{color:var(--ink);background:var(--wash-2);transform:translateY(-1px)}
.gbtn:active{transform:scale(.97)}
.gbtn svg{width:12px;height:12px;transition:transform .3s var(--ease)}
.gbtn:hover svg{transform:translateX(2px)}

.icon-btn{
  display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  color:var(--ink-3);border:1px solid transparent;
  transition:color .2s,border-color .2s,background-color .2s,transform .2s var(--ease);
}
.icon-btn:hover{color:var(--ink);border-color:var(--rule);background:var(--wash)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.3}
.icon-btn:disabled:hover{border-color:transparent;background:none;color:var(--ink-3)}
.icon-btn svg{width:15px;height:15px}

/* ---------------- layout ---------------- */
.main{
  display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
  gap:clamp(26px,3.6vw,58px);
  padding:clamp(16px,2.4vh,30px) 0 clamp(16px,2.2vh,26px);
  min-height:0;align-items:stretch;
}
.sect{min-width:0}

/* ---------------- hero stage ---------------- */
.stage{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0}
.hero{
  margin:0 0 clamp(13px,1.9vh,20px);font-weight:620;letter-spacing:-.04em;
  font-size:var(--hero);line-height:1.16;color:var(--ink);
}
.hero .hl{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.hero .hl > span{display:block;will-change:transform}
.hero .hl2{font-size:.82em;color:var(--ink-2);margin-top:.06em}
.hero em{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:1.1em;letter-spacing:-.005em;padding-right:.04em;
  color:var(--accent);
}
.hero .p{color:var(--accent)}
.lede{
  margin:0;max-width:30em;
  font-size:clamp(13.5px,1.14vw,15.5px);line-height:1.75;color:var(--ink-2);
}
.privacy{
  display:flex;align-items:center;gap:7px;margin:14px 0 0;
  font-size:12px;color:var(--ink-3);letter-spacing:.01em;
}
.privacy svg{width:13px;height:13px;flex:0 0 auto;color:var(--ok);opacity:.9}
.hero .hl > span{animation:heroIn 1.05s var(--ease) var(--d,0s) both}
@keyframes heroIn{
  from{opacity:0;transform:translateY(102%) rotate(2deg)}
  to{opacity:1;transform:none}
}

/* ---------------- input well ---------------- */
.well{
  position:relative;margin-top:clamp(18px,2.6vh,30px);
  height:clamp(146px,24vh,232px);
  background:linear-gradient(180deg,var(--well-tint),transparent 42%),var(--bg-3);
  border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 22px 48px -38px rgba(0,0,0,.8);
  transition:border-color .25s var(--ease),background-color .25s var(--ease),box-shadow .3s var(--ease);
}
.well:hover{border-color:var(--accent-line)}
.well:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft),0 18px 40px -30px var(--glow);
}
.well.is-drop{border-color:var(--accent);background:var(--accent-soft)}
.well::after{
  content:'';position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;
}
.well.is-fed::after{animation:fedRing .9s var(--ease)}
@keyframes fedRing{0%{opacity:.9;box-shadow:0 0 0 0 var(--glow)}100%{opacity:0;box-shadow:0 0 0 13px transparent}}
#token{
  display:block;width:100%;height:100%;padding:13px 34px 13px 14px;
  border:0;background:transparent;resize:none;outline:none;
  font-family:var(--mono);font-size:10.5px;line-height:1.7;letter-spacing:-.01em;
  color:var(--ink);caret-color:var(--accent);
}
#token::placeholder{color:transparent}
.well-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;
  padding:0 16px;pointer-events:none;
  transition:opacity .24s var(--ease),transform .24s var(--ease);
}
.well-empty.is-off{opacity:0;transform:translateY(-4px)}
.we-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.we-line .caret{width:2px;height:15px;background:var(--accent);display:block;animation:blink 1.15s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.06}}
.we-btns{display:flex;align-items:center;gap:7px;pointer-events:auto}
.mini{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;
  border:0;border-radius:999px;background:var(--wash);
  font-size:11.5px;color:var(--ink-2);
  transition:color .2s,transform .18s var(--ease),background-color .2s;
}
.mini:hover{color:var(--ink);background:var(--wash-2);transform:translateY(-1px)}
.mini:active{transform:scale(.97)}
.mini svg{width:12px;height:12px;opacity:.8}

.well-clear{
  position:absolute;top:9px;right:9px;width:22px;height:22px;
  display:grid;place-items:center;border-radius:50%;color:var(--ink-4);
  opacity:0;pointer-events:none;transition:opacity .2s,color .2s,background-color .2s,transform .2s var(--ease);
}
.well-clear.is-on{opacity:1;pointer-events:auto}
.well-clear:hover{color:var(--ink);background:var(--wash-2);transform:rotate(90deg)}
.well-clear svg{width:11px;height:11px}

/* ---------------- readout ---------------- */
.readout{
  display:flex;align-items:center;gap:9px;height:30px;margin-top:14px;
  font-size:11px;color:var(--ink-3);overflow:hidden;white-space:nowrap;
}
.ro-dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex:0 0 auto;transition:background-color .3s var(--ease),box-shadow .3s var(--ease)}
.readout.is-live .ro-dot{background:var(--ok);box-shadow:0 0 0 3px rgba(152,195,121,.16)}
.readout.is-warn .ro-dot{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.readout.is-stale .ro-dot{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.ro-main{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:10.5px;letter-spacing:.01em;max-width:46ch}
.readout.is-warn .ro-main{color:var(--err);font-family:var(--ui);font-size:11.5px}
.ro-sep{width:1px;height:9px;background:var(--rule);flex:0 0 auto}
.ro-tag{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px;flex:0 0 auto;
}
.ro-exp{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:0 0 auto}
.ro-exp.is-warn{color:var(--err)}

/* ---------------- deck / tabs ---------------- */
.deck{display:flex;flex-direction:column;justify-content:center;min-height:0}
.tabs{
  position:relative;display:flex;align-items:center;gap:1px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;
  flex:0 0 auto;padding-bottom:2px;
}
.tabs::-webkit-scrollbar{display:none}
.tabs.is-scroll{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.tabs.is-scroll.is-scrolled{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 26px),transparent)}
.tab{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 12px;flex:0 0 auto;border-radius:999px;
  font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;
  transition:color .25s var(--ease);
}
.tab svg{width:12px;height:12px;opacity:.6;transition:opacity .25s,transform .3s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab:hover svg{opacity:.95;transform:translateY(-1px)}
.tab.is-on{color:var(--accent);font-weight:600}
.tab.is-on svg{opacity:1}
.tab-sep{flex:0 0 1px;align-self:center;height:13px;background:var(--rule);margin:0 7px}
.tab-mark{
  position:absolute;left:0;top:0;height:34px;width:0;border-radius:999px;
  background:var(--accent-soft);border:1px solid transparent;
  z-index:0;pointer-events:none;will-change:transform,width;
}

/* ---------------- sheet ---------------- */
.sheet{
  position:relative;display:flex;flex-direction:column;
  flex:1 1 auto;min-height:0;margin-top:10px;
  background:var(--sheet);border:1px solid var(--sheet-line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
  transition:border-color .3s var(--ease),box-shadow .3s var(--ease),transform .3s var(--ease);
}
.sheet.is-flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.sheet-top{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:38px;padding:0 14px;border-bottom:1px solid var(--sheet-line);
  background:var(--sheet-2);
}
.fname{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcount{font-family:var(--mono);font-size:10px;color:var(--ink-4);white-space:nowrap}

.sheet-body{position:relative;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sheet-body::-webkit-scrollbar{width:9px;height:9px}
.sheet-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px;border:3px solid transparent;background-clip:content-box}
.sheet-body::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:content-box}

.code{padding:11px 0 14px;font-size:11.5px;line-height:20px;letter-spacing:-.01em}
.ln{display:flex;min-height:20px;transition:background-color .12s}
.ln:hover{background:var(--row)}
.gutter{
  flex:0 0 40px;text-align:right;padding-right:12px;
  font-family:var(--mono);font-size:9.5px;line-height:20px;
  color:var(--ink-4);opacity:.7;user-select:none;font-variant-numeric:tabular-nums;
}
.lc{flex:1 1 auto;min-width:0;padding-right:16px;font-family:var(--mono);white-space:pre-wrap;word-break:break-all;color:var(--ink);line-height:20px}
.lc .tk-key{color:var(--tk-key)}
.lc .tk-str{color:var(--tk-str)}
.lc .tk-num{color:var(--tk-num)}
.lc .tk-bool{color:var(--tk-bool)}
.lc .tk-cmd{color:var(--tk-cmd);font-weight:500}
.lc .tk-punct{color:var(--tk-punct)}

/* print-in */
.sheet.is-printing .ln{animation:printIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 13ms)}
@keyframes printIn{
  from{opacity:0;clip-path:inset(0 100% 0 0)}
  to{opacity:1;clip-path:inset(0 0 0 0)}
}
.sweep{
  position:absolute;left:0;right:0;top:0;height:2px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 22px 2px var(--glow);
}
.sheet.is-printing .sweep{animation:beam 1.05s cubic-bezier(.4,0,.2,1)}
@keyframes beam{
  0%{opacity:0;top:0}
  10%{opacity:.95}
  85%{opacity:.5}
  100%{opacity:0;top:100%}
}

/* empty */
.sheet-empty{
  position:absolute;inset:0;display:flex;align-items:flex-start;
  padding:14px 0 0;pointer-events:none;
  transition:opacity .3s var(--ease);
}
.sheet-empty::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 19px,var(--rule-2) 19px 20px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  opacity:.6;
}
.sheet-empty > *{position:relative;z-index:1}
.sheet-empty.is-off{opacity:0}
.se-caret{
  width:2px;height:15px;margin:2px 0 0 52px;background:var(--accent);display:block;
  animation:blink 1.15s steps(1,end) infinite;
}

/* stamp */
.stamp{
  position:absolute;left:50%;top:46%;
  translate:-50% -50%;rotate:-7deg;scale:1;
  padding:7px 16px;border:1.5px solid var(--accent);border-radius:6px;
  background:var(--sheet);
  font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;text-indent:.32em;
  color:var(--accent);opacity:0;pointer-events:none;z-index:4;white-space:nowrap;
}
.stamp.is-on{animation:stampIn 1.15s var(--ease) forwards}
@keyframes stampIn{
  0%{opacity:0;scale:1.6;rotate:-14deg}
  18%{opacity:1;scale:1;rotate:-7deg}
  70%{opacity:1;scale:1;rotate:-7deg}
  100%{opacity:0;scale:1;rotate:-7deg}
}

/* action bar */
.sheet-act{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-top:1px solid var(--sheet-line);
  background:var(--sheet-2);
}
.btn-copy{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  height:34px;padding:0 15px;border-radius:9px;overflow:hidden;
  background:var(--accent);color:var(--accent-ink);
  font-size:12.5px;font-weight:600;letter-spacing:.01em;
  transition:filter .25s var(--ease),transform .18s var(--ease),background-color .3s var(--ease);
}
.btn-copy:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn-copy:active:not(:disabled){transform:scale(.985)}
.btn-copy:disabled{background:var(--wash);color:var(--ink-4);border:0;font-weight:500}
.btn-copy::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  box-shadow:0 0 0 0 var(--glow);opacity:0;
}
.btn-copy.is-copied::after{animation:rippleBtn .8s var(--ease)}
@keyframes rippleBtn{0%{opacity:.9;box-shadow:0 0 0 0 var(--glow)}100%{opacity:0;box-shadow:0 0 0 16px transparent}}

.ico-box{position:relative;width:13px;height:13px;flex:0 0 auto}
.ico{position:absolute;inset:0;display:grid;place-items:center;transition:transform .4s var(--ease),opacity .18s linear}
.ico svg{width:13px;height:13px}
.ico-check{opacity:0;transform:scale(.4) rotate(-25deg)}
.btn-copy.is-copied .ico-copy{opacity:0;transform:scale(.55) rotate(18deg)}
.btn-copy.is-copied .ico-check{opacity:1;transform:scale(1) rotate(0)}

.copy-txt{display:grid;overflow:hidden;height:1.35em;align-content:center;line-height:1.35}
.copy-txt > span{grid-area:1/1;justify-self:start;white-space:nowrap;transition:transform .38s var(--ease),opacity .16s linear}
.copy-txt .t-done{opacity:0;transform:translateY(1.4em)}
.btn-copy.is-copied .t-idle{opacity:0;transform:translateY(-1.4em)}

  background:var(--veil);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .35s var(--ease);
}
body.is-expanded .veil{opacity:1;pointer-events:auto}
body.is-expanded .sheet{
  position:fixed;inset:clamp(12px,2.4vw,38px);height:auto;z-index:90;margin:0;
  box-shadow:0 0 0 1px var(--rule),0 50px 130px -40px rgba(0,0,0,.8);
  border-color:var(--rule);
}
body.is-expanded .code{font-size:12.5px;line-height:22px;padding:14px 0 18px}
body.is-expanded .ln{min-height:22px}
body.is-expanded .gutter{font-size:10px;line-height:22px;flex-basis:46px;padding-right:14px}
body.is-expanded .lc{line-height:22px}
body.is-expanded{overflow:hidden}

/* theme dissolve */
html.theming *,
html.theming *::before,
html.theming *::after{
  transition:background-color .44s var(--ease),color .44s var(--ease),
             border-color .44s var(--ease),box-shadow .44s var(--ease),
             fill .44s var(--ease),stroke .44s var(--ease) !important;
}
.ripple{
  position:fixed;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;
  border-radius:50%;pointer-events:none;z-index:110;
  background:radial-gradient(circle,var(--accent-soft) 0%,transparent 62%);
}

/* ---------------- guide pane ---------------- */
.pane{
  position:fixed;inset:0;z-index:120;
  display:flex;flex-direction:column;
  background:var(--bg-2);
  clip-path:inset(0 0 0 100%);
  transition:clip-path .74s cubic-bezier(.76,0,.24,1);
  will-change:clip-path;
}
.pane[hidden]{display:none}
.pane.is-open{clip-path:inset(0 0 0 0)}
.pane::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(110% 70% at 88% -8%,var(--accent-soft),transparent 58%);
}
.pane::after{
  content:'';position:absolute;left:-10%;bottom:-30%;width:60vw;height:60vw;border-radius:50%;
  background:radial-gradient(circle,var(--aura2),transparent 64%);
  filter:blur(70px);pointer-events:none;opacity:.7;
}
.pane-in{
  position:relative;z-index:1;width:100%;max-width:940px;height:100%;
  margin:0 auto;padding:0 clamp(22px,5vw,44px);
  display:flex;flex-direction:column;min-height:0;
}
.pane-bar{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between}
.back{
  display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border-radius:999px;border:0;color:var(--ink-2);font-size:12.5px;
  background:transparent;
  transition:color .25s,transform .3s var(--ease),background-color .25s;
}
.back:hover{color:var(--ink);background:var(--wash-2);transform:translateX(-3px)}
.back svg{width:13px;height:13px}

.pane-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pane-title{margin:0;font-size:clamp(36px,5.2vw,68px);line-height:1.1;letter-spacing:-.045em;font-weight:620;color:var(--ink)}
.pane-title .hl{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.pane-title .hl > span{display:block;opacity:0;transform:translateY(28px)}
.pane.is-open .pane-title .hl > span{opacity:1;transform:none;transition:opacity .6s var(--ease) .1s,transform .8s var(--ease) .1s}
.pane-title i{font-style:normal;color:var(--accent)}

.rows{list-style:none;margin:clamp(22px,4vh,36px) 0 0;padding:0;border-top:1px solid var(--rule)}
.rows li{border-bottom:1px solid var(--rule)}
.row{
  display:grid;grid-template-columns:58px minmax(0,1fr) 46px;align-items:center;gap:16px;
  width:100%;padding:clamp(22px,3.9vh,40px) 6px;text-align:left;text-decoration:none;color:var(--ink);
  background:none;border:0;

  transition-delay:calc(var(--i,0) * 80ms + 130ms);
}
.row:hover{background:var(--wash);padding-left:16px}
.row:active{background:var(--wash-2)}
.rn{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--accent);opacity:.9}
.rt{font-size:clamp(22px,2.8vw,34px);letter-spacing:-.025em;font-weight:560;line-height:1.25;overflow:hidden;text-overflow:ellipsis}

.ra{

body.view-guide{overflow:hidden}
body.view-guide .frame{transform:scale(.985);opacity:.4}

/* ---------------- misc ---------------- */
.no-js-note{

@media (prefers-reduced-motion: reduce){

    if (ms <= 0) return { text: '已过期', warn: true };
    var h = ms / 3600000;
    if (h < 24) return { text: Math.max(1, Math.round(h)) + ' 小时后过期', warn: true };
    var d = Math.round(h / 24);
    if (d > 60) return { text: Math.round(d / 30) + ' 个月后过期', warn: false };
    return { text: d + ' 天后过期', warn: d <= 2 };
  }
  function planLabel(p) {
    if (!p) return '';
    var map = { free: 'FREE', plus: 'PLUS', pro: 'PRO', team: 'TEAM', business: 'TEAM', enterprise: 'ENT', edu: 'EDU' };
    return map[p.toLowerCase()] || p.toUpperCase();
  }

  function paintReadout(raw, token, errCode) {
    var mode, main;
    if (!raw.trim()) {
      mode = 'idle'; main = '等待输入';
    } else if (!token) {
      mode = 'warn';
      main = errCode === 'no_account' ? 'JSON 可读，但缺少 chatgpt_account_id'
        : errCode === 'no_jwt' ? 'access_token 不是有效的 JWT'
          : '无法识别：请粘贴完整的 session JSON';
    } else {
      mode = 'live';
      main = token.email || token.accountId;
    }

    el.readout.classList.toggle('is-live', mode === 'live');
    el.readout.classList.toggle('is-warn', mode === 'warn');
    el.readout.classList.toggle('is-stale', !!(mode === 'live' && token.expiresUnix && token.expiresUnix * 1000 <= Date.now()));

    if (main !== lastRo) {
      lastRo = main;
      el.roMain.textContent = main;
      if (!REDUCE) {
        anim(el.roMain, { opacity: [0, 1], x: [-4, 0] }, { duration: 0.3, ease: EASE });
      }
    }

    var showExtra = mode === 'live';
    el.roSep1.hidden = !showExtra;
    el.roSep2.hidden = !showExtra;
    el.roPlan.hidden = !showExtra || !token.planType;
    el.roExp.hidden = !showExtra;

    if (showExtra) {
      el.roPlan.textContent = planLabel(token.planType) || 'CODEX';
      var e = expInfo(token.expiresUnix);
      el.roExp.textContent = e.text;
      el.roExp.classList.toggle('is-warn', e.warn);
      if (!REDUCE && el.roExp.dataset.shown !== '1') {
        anim([el.roPlan, el.roExp], { opacity: [0, 1] }, { duration: 0.35, ease: EASE });
      }
      el.roExp.dataset.shown = '1';
    } else {
      el.roExp.dataset.shown = '';
    }
  }

  /* ---------- rendering ---------- */
  var printTimer = 0;
  function printSheet() {
    if (REDUCE) return;
    el.sheet.classList.remove('is-printing');
    void el.sheet.offsetWidth;
    el.sheet.classList.add('is-printing');
    window.clearTimeout(printTimer);
    printTimer = window.setTimeout(function () { el.sheet.classList.remove('is-printing'); }, 1500);
    el.sheet.classList.add('is-flash');
    window.setTimeout(function () { el.sheet.classList.remove('is-flash'); }, 620);
  }

  function renderCode(text, mode) {
    var key = state.format + '::' + text;
    var lines = text ? text.split('\n') : [];

    if (!text) {
      el.code.innerHTML = '';
      el.sheetEmpty.classList.remove('is-off');
      el.lineCount.textContent = '0 行';
      state.renderedFor = key;
      return;
    }

    if (state.renderedFor === key) {
      if (mode === 'print') printSheet();
      return;
    }

    var hl = highlight(state.format, text);
    var html = '';
    for (var i = 0; i < lines.length; i++) {
      html += '<div class="ln" style="--i:' + Math.min(i, 24) + '"><span class="gutter">' + (i + 1) +
        '</span><span class="lc">' + hl[i] + '</span></div>';
    }
    el.code.innerHTML = html;
    el.sheetEmpty.classList.add('is-off');
    el.lineCount.textContent = lines.length + ' 行';
    el.codeScroll.scrollTop = 0;
    state.renderedFor = key;

    if (mode === 'print') printSheet();
    else if (mode === 'feed') anim(el.code, { opacity: [0, 1], y: [6, 0] }, { duration: 0.32, ease: EASE });
  }

  function fmtDateNote(fmt, output) {
    if (!output) return '待生成';
    if (JSON_FORMATS[fmt.id]) return 'JSON · 直接保存';
    return fmt.shell === 'cmd' ? '.cmd · 双击运行' : '复制到终端执行';
  }

  /* ---------- update ---------- */
  var updateTimer = 0;
  function scheduleUpdate() {
    window.clearTimeout(updateTimer);
    updateTimer = window.setTimeout(function () { update(); }, 110);
  }

  function update(opts) {
    opts = opts || {};
    var raw = state.raw;
    var parsed = parseSession(raw);
    var token = null, errCode = '';
    if (parsed) {
      try { token = buildToken(parsed); } catch (e) { errCode = (e && e.code) || 'bad'; }
    }
    var output = token ? outputFor(state.format, token) : '';
    var valid = !!token;

    state.token = token;
    state.output = output;

    paintReadout(raw, token, errCode);

    var mode = null;
    if (valid && !state.lastValid) {
      mode = 'print';
      el.well.classList.remove('is-fed');
      void el.well.offsetWidth;
      el.well.classList.add('is-fed');
      window.setTimeout(function () { el.well.classList.remove('is-fed'); }, 900);
    } else if (opts.mode) mode = opts.mode;
    renderCode(output, mode);

    var on = !!output;
    if (el.copyBtn.disabled === on) {
      el.copyBtn.disabled = !on;
      el.dlBtn.disabled = !on;
      el.expandBtn.disabled = !on;
      if (on && !REDUCE && mode === 'print') {
        anim(el.copyBtn, { y: [4, 0], opacity: [0.4, 1] }, { duration: 0.45, ease: EASE });
      }
      if (!on && document.body.classList.contains('is-expanded')) setExpanded(false);
    }

    if (!valid && state.copied) {
      state.copied = false;
      el.copyBtn.classList.remove('is-copied');
    }
    if (!opts.keepNotice) {
      state.notice = '';
      el.actNote.classList.remove('is-warn');
    }
    paintNote();
    el.wellEmpty.classList.toggle('is-off', raw.trim().length > 0);
    el.clearBtn.classList.toggle('is-on', raw.length > 0);
    state.lastValid = valid;
  }

  function paintNote() {
    var fmt = BY_ID[state.format];
    var txt, cls = '';
    if (state.notice) { txt = state.notice; cls = 'is-warn'; }
    else if (state.copied) { txt = JSON_FORMATS[state.format] ? '已复制 · 直接保存为 ' + fmt.kind : '已复制 · 粘贴到终端执行'; cls = 'is-ok'; }
    else if (state.token && state.token.expiresUnix && state.token.expiresUnix * 1000 <= Date.now()) { txt = '已过期 · 请重新获取'; cls = 'is-warn'; }
    else if (!state.output) { txt = '待生成'; }
    else { txt = fmtDateNote(fmt, state.output); }
    el.actNote.textContent = txt;
    el.actNote.className = 'act-note ' + cls;
  }

  var noticeTimer = 0;
  function notice(msg) {
    state.notice = msg;
    paintNote();
    window.clearTimeout(noticeTimer);
    noticeTimer = window.setTimeout(function () {
      state.notice = '';
      paintNote();
    }, 2800);
  }

  /* ---------- copy ---------- */
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  var copyTimer = 0, stampTimer = 0;
  function onCopied() {
    state.copied = true;
    state.notice = '';
    el.copyBtn.classList.add('is-copied');
    el.copyBtn.setAttribute('aria-label', '已复制');
    paintNote();
    anim(el.copyBtn, { scale: [0.965, 1] }, { duration: 0.55, ease: EASE });

    el.stamp.classList.remove('is-on');
    void el.stamp.offsetWidth;
    el.stamp.classList.add('is-on');
    window.clearTimeout(stampTimer);
    stampTimer = window.setTimeout(function () { el.stamp.classList.remove('is-on'); }, 1200);

    window.clearTimeout(copyTimer);
    copyTimer = window.setTimeout(function () {
      state.copied = false;
      el.copyBtn.classList.remove('is-copied');
      el.copyBtn.setAttribute('aria-label', '复制');
      paintNote();
    }, 2400);
  }

  async function doCopy() {
    if (!state.output) return;
    var text = state.output, ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) ok = legacyCopy(text);
    if (ok) onCopied();
    else {
      notice('复制失败，请手动选择文本');
      anim(el.copyBtn, { x: [0, -4, 4, -2, 0] }, { duration: 0.4, ease: 'easeInOut' });
    }
  }

  el.copyBtn.addEventListener('click', doCopy);

  /* ---------- download ---------- */
  function download() {
    if (!state.output) return;
    var fmt = BY_ID[state.format];
    var blob = new Blob([state.output], { type: fmt.json ? 'application/json' : 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fmt.file;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    notice('已下载 ' + fmt.file);
  }
  el.dlBtn.addEventListener('click', download);

  /* ---------- expand ---------- */
  function setExpanded(open) {
    if (open === document.body.classList.contains('is-expanded')) return;
    el.expandBtn.setAttribute('aria-label', open ? '收起' : '展开');
    el.expandBtn.title = open ? '收起' : '展开';
    var r = el.sheet.getBoundingClientRect();
    document.body.classList.toggle('is-expanded', open);
    var ic = $('svg', el.expandBtn);
    if (ic) ic.style.transform = open ? 'rotate(180deg)' : '';
    if (REDUCE) return;
    if (open) {
      anim(el.sheet, { opacity: [0, 1], scale: [0.972, 1], y: [12, 0] }, { duration: 0.42, ease: EASE });
    } else {
      anim(el.sheet, { opacity: [0, 1], scale: [1.02, 1], y: [8, 0] }, { duration: 0.34, ease: EASE });
    }
  }
  el.expandBtn.addEventListener('click', function () {
    setExpanded(!document.body.classList.contains('is-expanded'));
  });
  el.veil.addEventListener('click', function () { setExpanded(false); });

  /* ---------- input ---------- */
  el.token.addEventListener('input', function () {
    state.raw = el.token.value;
    scheduleUpdate();
  });
  el.token.addEventListener('paste', function () {
    window.setTimeout(function () {
      state.raw = el.token.value;
      update({ mode: 'print' });
    }, 0);
  });
  el.clearBtn.addEventListener('click', function () {
    el.token.value = '';
    state.raw = '';
    state.lastValid = false;
    state.renderedFor = null;
    update({ keepNotice: true });
    el.token.focus();
    anim(el.well, { scale: [0.994, 1] }, { duration: 0.35, ease: EASE });
  });
  el.well.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    el.token.focus();
  });

  el.pasteBtn.addEventListener('click', async function () {
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('unsupported');
      var text = await navigator.clipboard.readText();
      if (!text.trim()) { notice('剪贴板是空的'); return; }
      el.token.value = text;
      state.raw = text;
      update({ mode: 'print' });
      el.token.focus();
    } catch (e) {
      notice('浏览器未授权读取剪贴板，请手动粘贴');
      el.token.focus();
    }
  });

  function readFile(file) {
    if (!file) return;
    if (file.size > 512 * 1024) { notice('文件过大，请粘贴 session 内容'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      el.token.value = String(reader.result || '');
      state.raw = el.token.value;
      update({ mode: 'print' });
    };
    reader.readAsText(file);
  }
  el.fileBtn.addEventListener('click', function () { el.fileInput.click(); });
  el.fileInput.addEventListener('change', function () {
    readFile(el.fileInput.files && el.fileInput.files[0]);
    el.fileInput.value = '';
  });

  /* drag & drop on the whole input column */
  var deck = document.body;
  var dragDepth = 0;
  ['dragenter', 'dragover'].forEach(function (t) {
    deck.addEventListener(t, function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
      e.preventDefault();
      if (t === 'dragenter') dragDepth++;
      el.well.classList.add('is-drop');
    });
  });
  deck.addEventListener('dragleave', function (e) {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) el.well.classList.remove('is-drop');
  });
  deck.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    el.well.classList.remove('is-drop');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  el.codeScroll.addEventListener('click', function (e) {
    if (!state.output && !e.target.closest('button')) el.token.focus();
  });

  /* ---------- guide events ---------- */
  el.guideBtn.addEventListener('click', function () { setGuide(!state.open); });
  el.guideClose.addEventListener('click', function () { setGuide(false); });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    var meta = e.metaKey || e.ctrlKey;
    if (meta && e.key === 'Enter') {
      if (!el.copyBtn.disabled) { e.preventDefault(); doCopy(); }
    } else if (!meta && (e.key === '[' || e.key === ']')) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (typing || state.open) return;
      e.preventDefault();
      var at = FORMATS.map(function (f) { return f.id; }).indexOf(state.format);
      var step = e.key === ']' ? 1 : -1;
      setFormat(FORMATS[(at + step + FORMATS.length) % FORMATS.length].id);
    } else if (e.key === 'Escape') {
      if (state.open) setGuide(false);
      else if (document.body.classList.contains('is-expanded')) setExpanded(false);
    }
  });

  /* ---------- theme ---------- */
  var themeBtn = $('#themeBtn');
  var sunIcon = $('.i-sun', themeBtn);
  var moonIcon = $('.i-moon', themeBtn);

  function paintThemeBtn(theme) {
    var dark = theme === 'dark';
    sunIcon.style.display = dark ? '' : 'none';
    moonIcon.style.display = dark ? 'none' : '';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    paintThemeBtn(theme);
    var tc = document.getElementById('themeColor');
    if (tc) tc.setAttribute('content', theme === 'dark' ? '#1e2227' : '#f6f7f9');
    try { localStorage.setItem('codex-auth-theme', theme); } catch (e) {}
  }

  paintThemeBtn(document.documentElement.getAttribute('data-theme'));

  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    var r = themeBtn.getBoundingClientRect();
    var x = r.left + r.width / 2;
    var y = r.top + r.height / 2;

    anim(themeBtn, { rotate: next === 'dark' ? [0, 16] : [0, -16], scale: [0.92, 1] }, { duration: 0.42, ease: EASE });

    if (!REDUCE) {
      var root = document.documentElement;
      root.classList.add('theming');
      window.setTimeout(function () { root.classList.remove('theming'); }, 520);

      var d = document.createElement('div');
      d.className = 'ripple';
      d.style.left = x + 'px';
      d.style.top = y + 'px';
      document.body.appendChild(d);
      anim(d, { scale: [0.06, 1], opacity: [0.85, 0] }, { duration: 0.78, ease: EASE });
      window.setTimeout(function () { d.remove(); }, 820);
      window.setTimeout(function () { applyTheme(next); }, 40);
    } else {
      applyTheme(next);
    }
  });

  /* ---------- boot ---------- */
  function boot() {
    var isMac = /mac/i.test(navigator.platform || navigator.userAgent);
    el.kbd.textContent = isMac ? '⌘↵' : 'Ctrl↵';

    setFormat(state.format, { initial: true });
    update();
    paintNote();
    requestAnimationFrame(function () { placeMark(false); });
    window.setTimeout(function () { placeMark(false); }, 300);
    window.addEventListener('resize', function () { placeMark(false); });

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
